name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle system-wide
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Generate Gradle Wrapper
      run: |
        cd VibeKeyboard
        gradle wrapper --gradle-version 8.9

    - name: Build debug APK
      run: |
        cd VibeKeyboard
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: VibeKeyboard/app/build/outputs/apk/debug/app-debug.apk
