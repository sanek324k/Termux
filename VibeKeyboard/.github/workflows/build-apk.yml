name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Один и тот же ключ подписи для всех сборок, чтобы обновления ставились поверх без удаления
      - name: Use fixed debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp ci/debug.keystore "$HOME/.android/debug.keystore"
          if [ -n "$ANDROID_USER_HOME" ]; then
            mkdir -p "$ANDROID_USER_HOME"
            cp ci/debug.keystore "$ANDROID_USER_HOME/debug.keystore"
          fi

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon \
            -Pandroid.injected.version.code=$((1000 + GITHUB_RUN_NUMBER)) \
            -Pandroid.injected.version.name=0.$GITHUB_RUN_NUMBER

      - name: Show APK signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: VibeKeyboard-debug
          path: app/build/outputs/apk/debug/*.apk
