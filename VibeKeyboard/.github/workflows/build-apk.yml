name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      run: cd VibeKeyboard && gradle wrapper

    - name: Grant execute permission for gradlew
      run: cd VibeKeyboard && chmod +x gradlew

    - name: Build debug APK
      run: cd VibeKeyboard && ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: VibeKeyboard/app/build/outputs/apk/debug/app-debug.apk
