name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle Direct
      run: |
        cd VibeKeyboard
        # Скачиваем официальный gradle во время сборки без всяких танцев с бубном
        wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
        unzip -q gradle-8.9-bin.zip
        export PATH=$PWD/gradle-8.9/bin:$PATH
        
        # Собираем проект напрямую через скачанный бинарник
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: VibeKeyboard/app/build/outputs/apk/debug/app-debug.apk
